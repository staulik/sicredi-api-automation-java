stages:
  - test

image: gradle:8.9-jdk17

variables:
  API_DIR: "api_tests"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/$API_DIR/.gradle"
  ALLURE_RESULTS_DIR: "build/allure-results"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  policy: pull-push
  paths:
    - $API_DIR/.gradle/wrapper
    - $API_DIR/.gradle/caches

test:java:
  stage: test
  before_script:
    - cd "$API_DIR"
  script:
    - gradle --version
    - gradle clean test -Dallure.results.directory=$ALLURE_RESULTS_DIR
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - $API_DIR/build/test-results/test/
      - $API_DIR/build/reports/tests/test/
      - $API_DIR/build/allure-results/
    reports:
      junit: $API_DIR/build/test-results/test/*.xml
      allure: $API_DIR/build/allure-results



name: CI - API Tests (SICREDI)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Roda testes; mesmo falhando, segue adiante para gerar o Allure
      - name: Run tests (generate allure-results)
        working-directory: api_tests
        continue-on-error: true
        run: |
          gradle --version
          gradle clean test

      # Lista saídas para debug rápido
      - name: List build outputs (debug)
        run: |
          echo "allure-results:" && ls -la api_tests/build/allure-results || true

      # Gera o Allure HTML se houver resultados
      - name: Generate Allure Report
        if: ${{ hashFiles('api_tests/build/allure-results/**') != '' }}
        uses: simple-elf/allure-report-action@v1
        with:
          allure_results: api_tests/build/allure-results
          allure_report:  api_tests/build/allure-report

      # Faz upload do relatório HTML como artifact para download
      - name: Upload Allure HTML
        if: ${{ hashFiles('api_tests/build/allure-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: api_tests/build/allure-report
          retention-days: 7

      # Sempre guarda os brutos para inspeção
      - name: Upload raw artifacts (JUnit/HTML/allure-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            api_tests/build/test-results/test/
            api_tests/build/reports/tests/test/
            api_tests/build/allure-results/



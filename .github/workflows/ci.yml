name: CI - API Tests (SICREDI)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests (generate allure-results)
        working-directory: api_tests
        run: |
          gradle --version
          gradle clean test -Dallure.results.directory=build/allure-results

      - name: List build outputs (debug)
        run: |
          echo "Root:"
          ls -la
          echo "api_tests:"
          ls -la api_tests || true
          echo "build:"
          ls -la api_tests/build || true
          echo "allure-results:"
          ls -la api_tests/build/allure-results || true

      # Só gera o Allure se houver results
      - name: Generate Allure Report
        if: ${{ hashFiles('api_tests/build/allure-results/**') != '' }}
        uses: simple-elf/allure-report-action@v1
        with:
          allure_results: api_tests/build/allure-results
          report_path: api_tests/build/allure-report

      - name: Verify Allure report
        if: ${{ hashFiles('api_tests/build/allure-results/**') != '' }}
        run: |
          test -d api_tests/build/allure-report
          echo "Allure report OK"

      - name: Upload raw artifacts (JUnit/HTML/allure-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            api_tests/build/test-results/test/
            api_tests/build/reports/tests/test/
            api_tests/build/allure-results/

      # Só prepara Pages se o relatório existir
      - name: Upload Pages artifact (Allure)
        if: ${{ hashFiles('api_tests/build/allure-report/**') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: api_tests/build/allure-report

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() && hashFiles('api_tests/build/allure-report/**') != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



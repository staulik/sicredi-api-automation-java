name: CI - API Tests (SICREDI)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      allure_exists: ${{ steps.check.outputs.allure }}
      gradle_exists: ${{ steps.check.outputs.gradle }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Roda testes; mesmo com falha, segue pra gerar relatórios
      - name: Run tests (generate allure-results)
        working-directory: api_tests
        continue-on-error: true
        run: |
          gradle --version
          gradle clean test

      - name: List build outputs (debug)
        run: |
          echo "Gradle report dir:" && ls -la api_tests/build/reports/tests/test || true
          echo "Allure results dir:" && ls -la api_tests/build/allure-results || true

      # Verifica se existem resultados para cada relatório
      - name: Check reports presence
        id: check
        run: |
          if [ -d "api_tests/build/allure-results" ] && [ -n "$(ls -A api_tests/build/allure-results || true)" ]; then
            echo "allure=true" >> $GITHUB_OUTPUT
          else
            echo "allure=false" >> $GITHUB_OUTPUT
          fi
          if [ -d "api_tests/build/reports/tests/test" ] && [ -n "$(ls -A api_tests/build/reports/tests/test || true)" ]; then
            echo "gradle=true" >> $GITHUB_OUTPUT
          else
            echo "gradle=false" >> $GITHUB_OUTPUT
          fi

      # Gera o Allure HTML somente se houver results
      - name: Generate Allure Report
        if: ${{ steps.check.outputs.allure == 'true' }}
        uses: simple-elf/allure-report-action@v1
        with:
          allure_results: api_tests/build/allure-results
          allure_report:  api_tests/build/allure-report

      # Prepara o "site" com os relatórios disponíveis
      - name: Build Pages site (Allure + Gradle)
        run: |
          set -e
          rm -rf site
          mkdir -p site
          # Copia Allure se existir
          if [ -d "api_tests/build/allure-report" ]; then
            mkdir -p site/allure-report
            cp -r api_tests/build/allure-report/* site/allure-report/
            ALLURE_LINK='<li><a href="./allure-report/index.html">Allure Report</a></li>'
          else
            ALLURE_LINK=''
          fi
          # Copia Relatório Padrão (Gradle) se existir
          if [ -d "api_tests/build/reports/tests/test" ]; then
            mkdir -p site/gradle-report
            cp -r api_tests/build/reports/tests/test/* site/gradle-report/
            GRADLE_LINK='<li><a href="./gradle-report/index.html">Relatório Padrão (Gradle)</a></li>'
          else
            GRADLE_LINK=''
          fi
          # Cria um index juntando tudo
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="pt-br">
          <head>
            <meta charset="utf-8"/>
            <title>Relatórios - Sicredi API Tests</title>
          </head>
          <body>
            <h1>Relatórios - Sicredi API Tests</h1>
            <ul>
              ${ALLURE_LINK}
              ${GRADLE_LINK}
            </ul>
            <p>Gerado por GitHub Actions.</p>
          </body>
          </html>
          EOF
          echo "=== Site pronto ==="
          find site -maxdepth 2 -type f -name index.html -print

      # Publica o "site" no GitHub Pages (sempre terá pelo menos um index.html)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


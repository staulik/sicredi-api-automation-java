name: CI - API Tests (SICREDI)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Roda testes; mesmo com falha, segue (pra sempre termos allure-results)
      - name: Run tests (generate allure-results)
        working-directory: api_tests
        continue-on-error: true
        run: |
          gradle --version
          gradle clean test

      # Debug rápido pra ver o que foi gerado
      - name: List build outputs (debug)
        run: |
          echo "Gradle report dir:" && ls -la api_tests/build/reports/tests/test || true
          echo "Allure results dir:" && ls -la api_tests/build/allure-results || true

      # Gera o Allure HTML somente se houver results
      - name: Generate Allure Report
        if: ${{ hashFiles('api_tests/build/allure-results/**') != '' }}
        uses: simple-elf/allure-report-action@v1
        with:
          allure_results: api_tests/build/allure-results
          allure_report:  api_tests/build/allure-report

      # Artifact 1: Allure HTML (index.html dentro)
      - name: Upload Allure HTML
        if: ${{ hashFiles('api_tests/build/allure-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: api_tests/build/allure-report
          retention-days: 7

      # Artifact 2: Relatório Padrão do Gradle (index.html)
      - name: Upload Gradle HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-report
          path: api_tests/build/reports/tests/test
          retention-days: 7

      # Artifact 3: brutos pra debug (JUnit/XML, HTML do Gradle e allure-results)
      - name: Upload raw artifacts (JUnit/HTML/allure-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            api_tests/build/test-results/test/
            api_tests/build/reports/tests/test/
            api_tests/build/allure-results/
          retention-days: 7




stages:
  - test

image: gradle:8.9-jdk17

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Diretório padrão onde o adapter do Allure vai gravar
  ALLURE_RESULTS_DIR: "build/allure-results"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  policy: pull-push
  paths:
    - .gradle/wrapper
    - .gradle/caches

test:java:
  stage: test
  script:
    - gradle --version
    - gradle clean test -Dallure.results.directory=$ALLURE_RESULTS_DIR
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/test-results/test/
      - build/reports/tests/test/
      - build/allure-results/
    reports:
      junit: build/test-results/test/*.xml
      allure: build/allure-results

